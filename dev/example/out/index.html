<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
:root{
	--ink: #111315;
	--paper: #f6f7f9;
	--surface: #ffffff;
	--line: rgba(17, 19, 21, 0.12);
	--muted: rgba(17, 19, 21, 0.68);
	--accent: #19c6a7;
	--accent-warm: #ff6b4a;
	--accent-gold: #f4b942;
}
*{
	box-sizing: border-box;
}
html{
	scroll-behavior: smooth;
}
body{
	margin: 0;
	background: var(--paper);
	color: var(--ink);
	font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
a{
	color: inherit;
	text-decoration: none;
}
button{
	border: none;
	font: inherit;
}
.site-nav{
	position: sticky;
	top: 0;
	z-index: 5;
	backdrop-filter: blur(18px);
	background: rgba(246, 247, 249, 0.86);
	border-bottom: solid 1px var(--line);
}
.site-nav a{
	transition: color 120ms, background 120ms;
}
.site-nav a:hover{
	color: var(--accent-warm);
}
.nav-link{
	padding: 0.7rem 0.85rem;
	border-radius: 0.45rem;
	color: var(--muted);
	font-size: 0.88rem;
	font-weight: 650;
}
.nav-link:hover{
	background: rgba(17, 19, 21, 0.055);
}
.github-link{
	background: var(--ink);
	color: white;
}
.github-link:hover{
	background: #24282b;
	color: white;
}
.site-footer{
	border-top: solid 1px var(--line);
}
</style>
</head>
<body>
<div class="site-nav"><div style="max-width:1180px;margin:0 auto;padding:0.9rem 1.4rem;display:grid;grid-template-columns:auto auto;align-items:center;gap:1rem;"><a href="/"><div style="display:flex;align-items:center;gap:0.75rem;font-weight:850;letter-spacing:-0.02em;"><div style="width:2.2rem;height:2.2rem;border-radius:0.45rem;background:linear-gradient(135deg, var(--accent), var(--accent-warm) 58%, var(--accent-gold));box-shadow:0 12px 30px rgb(25 198 167 / 25%);"></div><div style="font-size:1.08rem;">Rue</div></div></a><div style="display:flex;align-items:center;justify-content:end;gap:0.2rem;flex-wrap:wrap;"><a href="#syntax" class="nav-link">Syntax</a><a href="#runtime" class="nav-link">Runtime</a><a href="#roadmap" class="nav-link">Roadmap</a><a href="https://github.com/aaron-meche/rue-lang" class="nav-link github-link" target="_blank" rel="noopener">GitHub</a></div></div></div><div style="font-size:1.2rem;font-weight:600;">Hi</div><div class="site-footer"><div style="max-width:1180px;margin:0 auto;padding:2.2rem 1.4rem;display:grid;grid-template-columns:minmax(0, 1fr) auto;gap:1rem;align-items:center;"><div style="color:var(--muted);font-size:0.92rem;line-height:1.6;">Rue is an experimental language and compiler for building UI directly from .rue files.</div><div style="color:var(--muted);font-size:0.92rem;font-weight:650;">Created by Aaron Meche</div></div></div>

</body>
</html>
