<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
	--bg: hsl(230, 0%, 0%, 1);
	--l1: hsl(230, 4%, 6%, 1);
	--l2: hsl(230, 8%, 12%, 1);
	--l3: hsl(230, 12%, 18%, 1);
	--l4: hsl(230, 16%, 24%, 1);
	--l5: hsl(230, 20%, 30%, 1);
	--l6: hsl(230, 24%, 36%, 1);
	--l7: hsl(230, 28%, 42%, 1);
}
body{
	margin: 0;
	background: var(--bg);
	font-family: Verdana, sans-serif;
	color: white;
}
.nav-button-wrapper *{
	padding: 0.6rem 1rem;
	font-size: 0.75rem;
	letter-spacing: 0.24pt;
	border-radius: 0.4rem;
	transition: background 80ms, opacity 80ms;
	opacity: 0.8;
	cursor: pointer;
}
.nav-button-wrapper *:hover{
	background: var(--l2);
	opacity: 1;
}
</style>
</head>
