<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
:root{
	--bg: hsl(230, 0%, 0%, 1);
	--l1: hsl(230, 4%, 6%, 1);
	--l2: hsl(230, 8%, 12%, 1);
	--l3: hsl(230, 12%, 18%, 1);
	--l4: hsl(230, 16%, 24%, 1);
	--l5: hsl(230, 20%, 30%, 1);
	--l6: hsl(230, 24%, 36%, 1);
	--l7: hsl(230, 28%, 42%, 1);
}
body{
	margin: 0;
	background: var(--bg);
	font-family: Verdana, sans-serif;
	color: white;
}
.nav-button-wrapper *{
	padding: 0.6rem 1rem;
	font-size: 0.75rem;
	letter-spacing: 0.24pt;
	border-radius: 0.4rem;
	transition: background 80ms, opacity 80ms;
	opacity: 0.8;
	cursor: pointer;
}
.nav-button-wrapper *:hover{
	background: var(--l2);
	opacity: 1;
}
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:auto min-content;align-items:center;padding:1.2rem 2.4rem;border-bottom:solid 1pt var(--l2);"><div style="display:flex;align-items:center;gap:0.8rem;font-weight:600;"><img src="small-pfp.png" style="height:2rem;border-radius:100vh;">Aaron Meche</div><div style="display:flex;align-items:center;" class="nav-button-wrapper"><div>Projects</div><div>Education</div><div>GitHub</div><div>LinkedIn</div></div></div><div style="display:grid;gap:1rem;margin-block:20rem;padding-inline:3rem;"><div style="font-size:0.8rem;font-weight:500;letter-spacing:0.6pt;text-transform:uppercase;color:hsl(260, 100%, 70%);">Software Engineer</div><div style="font-size:4.5rem;font-weight:1000;letter-spacing:-2pt;">Aaron Meche</div><div style="font-size:1.2rem;font-weight:300;opacity:0.75;">Senior @ Louisiana State University · c/o 2026</div><div style="font-size:0.9rem;font-weight:500;opacity:0.5;">Lake Charles, LA</div></div><div style="padding:0 2.4rem;"><div style="font-size:0.9rem;font-weight:600;opacity:0.5;">Featured Projects</div><div style="display:grid;"></div></div><div style="text-align:center;"><div live_state="state_iyuo77axn">Live Counter: 0</div><button onclick="(() =&gt; {
__rueState.set(&quot;count&quot;, __rueState.get(&quot;count&quot;) + 1)
})(this);">+</button></div>
<script>
window.__rueStateData = {"count":0};
window.__rueRenderers = {
"state_iyuo77axn": () => {
return "Live Counter: " + __rueState.get("count")
}
};
window.__rueToHTML = input => {
    if (input === null || input === undefined || input === false) return "";
    if (Array.isArray(input)) return input.map(window.__rueToHTML).join("");
    if (input && typeof input.getHTML == "function") return input.getHTML();
    return String(input);
};
window.__rueRenderState = () => {
    document.querySelectorAll("[live_state]").forEach(elem => {
        let renderer = window.__rueRenderers[elem.getAttribute("live_state")];
        if (typeof renderer == "function") elem.innerHTML = window.__rueToHTML(renderer());
    });
};
window.__rueState = {
    get: name => window.__rueStateData[name],
    set: (name, value) => {
        window.__rueStateData[name] = value;
        window.__rueRenderState();
        return value;
    },
    update: callback => {
        let next = callback(window.__rueStateData);
        if (next) window.__rueStateData = next;
        window.__rueRenderState();
    }
};
var __rueState = window.__rueState;
</script>
</body>
</html>
